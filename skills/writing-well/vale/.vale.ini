# Mechanical pass for the writing-well skill.
#
#   vale --no-global --config=<skill>/vale/.vale.ini --output=JSON <file>
#
# Alerts are candidates, not findings. See vale/README.md for the tiers.

StylesPath = styles
MinAlertLevel = suggestion
Vocab = Project

[formats]
txt = md

[*]
BasedOnStyles = WritingWell

# A draft that discusses bad prose has to quote it. Skip the specimen:
# bold labels, quoted strings, and code spans.
TokenIgnores = (\*\*[^*\n]+\*\*), ("[^"\n]+"), (“[^”\n]+”), (`[^`\n]+`)
# Blockquotes are someone else's words.
BlockIgnores = (?s) *(> .*?\n\n)
